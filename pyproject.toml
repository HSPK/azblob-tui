[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "azblob-tui"
version = "0.2.1"
description = "Terminal browser for Azure Blob Storage with AML snapshot filtering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = "MIT"
authors = [
  { name = "HSPK" },
]
keywords = [
  "azure",
  "blob-storage",
  "tui",
  "terminal",
  "storage",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console :: Curses",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]

[project.scripts]
abt = "azure_blob_tui.cli:main"

[project.urls]
Homepage = "https://github.com/HSPK/azblob-tui"
Repository = "https://github.com/HSPK/azblob-tui"
Issues = "https://github.com/HSPK/azblob-tui/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
azure_blob_tui = ["py.typed"]
